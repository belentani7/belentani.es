# One-off, branch-scoped lockfile regeneration for the October 2026 Next.js patch.
# Removed before merging the migration PR.
name: Regenerate Next.js security lockfile
on:
  push:
    branches:
      - agent/next15-security-patch-20261029
    paths:
      - package.json
      - .github/workflows/next-security-lockfile.yml

permissions:
  contents: write

concurrency:
  group: next15-security-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.repository == 'belentani7/belentani.es'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Resolve exact dependency graph (no lifecycle scripts)
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify frozen resolution (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit only regenerated lockfile on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "::error::Lockfile did not change; inspect dependency resolution."
            exit 1
          fi
          git add -- pnpm-lock.yaml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): resolve patched Next.js and Sharp lockfile"
          git push origin HEAD:agent/next15-security-patch-20261029
