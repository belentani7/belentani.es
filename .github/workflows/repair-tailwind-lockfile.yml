# Temporary one-off workflow to reconcile pinned Tailwind 4.3.3 internals in PR #77.
# Removed after its lockfile commit; not intended for main.
name: Repair Tailwind lockfile on PR 77
on:
  push:
    branches:
      - dependabot/npm_and_yarn/dev-dependencies-d2e2d59303
    paths:
      - package.json
      - .github/workflows/repair-tailwind-lockfile.yml

permissions:
  contents: write

concurrency:
  group: repair-pr77-tailwind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.repository == 'belentani7/belentani.es'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Resolve updated Tailwind internal dependency graph
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify reproducible lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit the resolved pnpm lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "::error::Expected lockfile change is missing."
            exit 1
          fi
          git add -- pnpm-lock.yaml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): align Tailwind 4.3 internals"
          git push origin HEAD:dependabot/npm_and_yarn/dev-dependencies-d2e2d59303
