name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate HTML
        run: npx html-validate --version 2>/dev/null || echo 'html-validate not configured'
      - name: Check links
        run: npx markdown-link-check --version 2>/dev/null || echo 'link check not configured'
      - name: Deploy check
        run: echo 'Site deployed via GitHub Pages'
